batch:
  kafka:
    namespace: "job-report-daily"
    request-topic: "requests"
    reply-topic: "replies"
    group-id: "report-group"
    enabled: true
  partition:
    strategy:
      force-local: false
    grid-size: 8
    chunk-size: 50
  task-executor:
    type: "qoop-async"
    thread-name-prefix: "report-batch-"
    concurrency-limit: 20